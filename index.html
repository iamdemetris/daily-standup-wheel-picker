<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foxes Team Daily Wheel</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">

    <link rel="stylesheet" href="./styles.css">

    <!-- Prevent flash before styles.css loads -->
    <style>html, body { background: #0B0B0F; color: #F5F5F4; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }</style>

    <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <!-- Things Tailwind can't express cleanly: per-day accent, aurora gradient, wheel rim shadow stack. -->
    <style type="text/css">
        :root { --accent: #FF6A3D; }
        body[data-day="0"], body[data-day="6"] { --accent: #A78BFA; }
        body[data-day="1"] { --accent: #6366F1; }
        body[data-day="2"] { --accent: #0EA5E9; }
        body[data-day="3"] { --accent: #F59E0B; }
        body[data-day="4"] { --accent: #84CC16; }
        body[data-day="5"] { --accent: #FF6A3D; }

        .accent-text { color: var(--accent); }

        /* Soft blobs are pre-blurred via long gradient falloffs (no per-frame
           filter re-rasterization); the drift is a compositor-only transform. */
        .friday-aurora {
            inset: -12%;
            background:
                radial-gradient(at 20% 30%, #FF6A3D 0%, transparent 62%),
                radial-gradient(at 80% 20%, #C4421F 0%, transparent 62%),
                radial-gradient(at 60% 80%, #FFB199 0%, transparent 62%),
                radial-gradient(at 10% 90%, #FFD166 0%, transparent 62%),
                radial-gradient(at 90% 60%, #9333EA 0%, transparent 62%);
            background-size: 200% 200%;
        }
        body[data-day="5"] .friday-aurora { opacity: 0.45; }

        .wheel-rim {
            z-index: 1;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.04),
                inset 0 0 0 1px #26262F,
                0 0 0 8px #16161C,
                0 0 0 9px rgba(255,255,255,0.05),
                0 28px 60px -24px rgba(0,0,0,0.88),
                0 64px 130px -52px rgba(0,0,0,0.82),
                0 0 90px -56px color-mix(in srgb, var(--accent) 42%, transparent);
        }
        .wheel-float {
            isolation: isolate;
        }
        .wheel-float::before {
            content: "";
            position: absolute;
            left: 8%;
            right: 8%;
            bottom: -12%;
            height: 26%;
            border-radius: 9999px;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.72), rgba(0,0,0,0.34) 45%, transparent 74%);
            filter: blur(22px);
            transform: scaleX(1.08);
            z-index: -1;
            pointer-events: none;
        }
        .wheel-float::after {
            content: "";
            position: absolute;
            inset: -6%;
            border-radius: 9999px;
            background: radial-gradient(circle at 50% 50%, transparent 0 26%, color-mix(in srgb, var(--accent) 10%, transparent) 42%, transparent 72%);
            filter: blur(30px);
            opacity: 0.58;
            z-index: -1;
            pointer-events: none;
        }
        .wheel-transition { transition: transform 4.6s cubic-bezier(0.16, 1, 0.3, 1); }

        .panel-float {
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.04),
                0 18px 44px -30px rgba(0,0,0,0.95),
                0 36px 90px -58px rgba(0,0,0,0.85);
        }
        .panel-float.bg-surface {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0) 42%),
                #16161C;
        }

        .center-pin {
            background: radial-gradient(circle at 30% 30%, #1F1F27, #16161C);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.12),
                inset 0 -1px 0 rgba(0,0,0,0.45),
                0 4px 22px rgba(0,0,0,0.55);
        }

        .pointer-svg {
            filter: drop-shadow(0 2px 0 #C4421F) drop-shadow(0 8px 18px rgba(255,106,61,0.4));
        }

        .spin-btn {
            background: linear-gradient(180deg, #FF7A4D, #FF5A28);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.25),
                inset 0 -1px 0 rgba(0,0,0,0.2),
                0 10px 30px -8px rgba(255,106,61,0.55);
            transition: transform 0.18s cubic-bezier(0.32, 0.72, 0, 1),
                        box-shadow 0.18s cubic-bezier(0.32, 0.72, 0, 1);
        }
        .spin-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.3),
                inset 0 -1px 0 rgba(0,0,0,0.2),
                0 14px 40px -8px rgba(255,106,61,0.7);
        }
        .spin-btn:active:not(:disabled) { transform: translateY(0); }

        .pip-base {
            background: #1F1F27;
            color: #908A85;
        }
        .pip-done {
            background: color-mix(in srgb, var(--accent) 28%, transparent);
            color: #F5F5F4;
        }
        .pip-today {
            background: var(--accent);
            color: white;
            box-shadow:
                0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent),
                0 0 24px color-mix(in srgb, var(--accent) 65%, transparent);
        }

        .marquee-mask {
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
                    mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
        }

        .glass-overlay {
            backdrop-filter: blur(20px) saturate(120%);
            -webkit-backdrop-filter: blur(20px) saturate(120%);
        }

        @media (prefers-reduced-motion: reduce) {
            .motion-only,
            .animate-settle { animation: none !important; }
            .wheel-transition { transition: none !important; }
        }
    </style>
</head>
<body data-day="1" class="relative bg-bg text-text font-sans antialiased min-h-screen overflow-x-hidden">

    <div class="friday-aurora pointer-events-none fixed inset-0 z-0 opacity-0 transition-opacity duration-1000 motion-only" aria-hidden="true"></div>
    <script>
        if (matchMedia('(prefers-reduced-motion: no-preference)').matches) {
            document.addEventListener('DOMContentLoaded', () => {
                document.querySelector('.friday-aurora').classList.add('motion-safe:animate-aurora');
            });
        }
    </script>

    <!--
      Single outer CSS Grid binds the entire page.
      Mobile (<md): 1 column, everything stacks in DOM order.
      Desktop/tablet (md+): 3 columns [day info | wheel stage | rail], 2 rows:
        row 1: topbar spans all columns
        row 2: hero top-left, wheel/action centered, rail top-right
      This keeps the requested anchors without letting the hero push the wheel down.
    -->
    <div class="relative z-10 w-full min-h-svh md:h-svh md:min-h-0 md:overflow-hidden
                px-4 sm:px-6 lg:px-10 py-3 sm:py-4
                grid gap-y-3 sm:gap-y-4 md:gap-y-3 gap-x-4 lg:gap-x-8
                grid-cols-1 md:grid-cols-[minmax(160px,220px)_minmax(220px,1fr)_240px]
                lg:grid-cols-[minmax(220px,280px)_minmax(320px,1fr)_300px]
                xl:grid-cols-[minmax(260px,340px)_minmax(440px,1fr)_400px]
                md:grid-rows-[auto_minmax(0,1fr)]">

        <!-- ROW 1 (md+: spans all cols): Topbar -->
        <header class="md:col-span-3 flex items-center justify-between gap-3">
            <div class="text-[0.7rem] font-semibold tracking-[0.22em] uppercase text-text-muted">FOXES DAILY WHEEL</div>
            <button id="soundToggle"
                    type="button"
                    class="bg-surface border border-border-c text-text-muted hover:text-text hover:border-text-muted w-9 h-9 rounded-lg flex items-center justify-center transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-brand focus-visible:ring-offset-2 focus-visible:ring-offset-bg shrink-0"
                    aria-pressed="false" aria-label="Enable chime" title="Toggle chime">🔕</button>
        </header>

        <!-- ROW 2 col 1: Hero (date + day name + pips + countdown) -->
        <section class="md:col-start-1 md:row-start-2 md:self-start text-center md:text-left flex flex-col items-center md:items-start gap-2 pt-2 md:pt-3">
            <div id="dateLine" class="text-[0.7rem] sm:text-xs font-semibold tracking-[0.28em] uppercase text-text-muted tabular-nums">
                Thu · 21 May 2026
            </div>
            <h1 id="dayName" class="font-black uppercase leading-[0.9] tracking-[-0.055em]
                                    text-3xl sm:text-4xl md:text-5xl">
                <span class="accent-text">Monday</span>
            </h1>
            <div id="marquee" class="marquee-mask hidden w-full max-w-[640px] overflow-hidden whitespace-nowrap mt-1" aria-hidden="true">
                <span class="inline-block font-bold text-xs tracking-[0.32em] uppercase text-brand motion-only animate-marquee" style="padding-left:100%;">
                    IT'S FRIDAY 🦊 WEEKEND INCOMING 🦊 GO HAVE FUN 🦊 IT'S FRIDAY 🦊
                </span>
            </div>
            <div id="weekStrip" class="flex gap-1.5 mt-1.5 flex-wrap justify-center md:justify-start"
                 role="progressbar" aria-valuemin="1" aria-valuemax="5" aria-label="Week progress">
                <div class="pip pip-base w-10 h-3.5 rounded-full grid place-items-center text-[0.55rem] font-semibold tracking-wider transition-all duration-300" data-day="1">MON</div>
                <div class="pip pip-base w-10 h-3.5 rounded-full grid place-items-center text-[0.55rem] font-semibold tracking-wider transition-all duration-300" data-day="2">TUE</div>
                <div class="pip pip-base w-10 h-3.5 rounded-full grid place-items-center text-[0.55rem] font-semibold tracking-wider transition-all duration-300" data-day="3">WED</div>
                <div class="pip pip-base w-10 h-3.5 rounded-full grid place-items-center text-[0.55rem] font-semibold tracking-wider transition-all duration-300" data-day="4">THU</div>
                <div class="pip pip-base w-10 h-3.5 rounded-full grid place-items-center text-[0.55rem] font-semibold tracking-wider transition-all duration-300" data-day="5">FRI</div>
            </div>
            <div id="countdown" class="text-xs sm:text-sm font-medium text-text-muted tabular-nums tracking-tight mt-0.5">
                Weekend in 4 days
            </div>
        </section>

        <!-- ROW 2 col 2: Stage (wheel + spin), centered as the primary action -->
        <main class="md:col-start-2 md:row-start-2 md:h-full min-h-0 flex flex-col items-center justify-center gap-5 sm:gap-6 md:-translate-y-4 lg:-translate-y-5">
            <!-- Fallback (pre-JS) size leaves room for the wheel-float glow
                 (6% overhang) so the page never overflows horizontally. -->
            <div id="wheelOuter"
                 class="wheel-float relative aspect-square mx-auto"
                 style="width: var(--wheel-size, min(50svh, calc(100% - 24px), 500px)); height: var(--wheel-size, min(50svh, calc(100% - 24px), 500px));">
                <div class="absolute top-[-12px] sm:top-[-16px] left-1/2 -translate-x-1/2 z-30 w-9 sm:w-10 md:w-11 pointer-events-none pointer-svg">
                    <svg viewBox="0 0 44 56" fill="none" class="block w-full h-auto" aria-hidden="true">
                        <path d="M22 56C22 56 4 30 4 18C4 8 12 0 22 0C32 0 40 8 40 18C40 30 22 56 22 56Z" fill="#FF6A3D"/>
                    </svg>
                </div>
                <div id="chartContainer" class="wheel-rim wheel-transition relative w-full h-full rounded-full overflow-hidden"></div>
                <div class="center-pin absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20
                            w-[18%] aspect-square rounded-full flex items-center justify-center text-2xl sm:text-3xl"
                     aria-hidden="true">🦊</div>
            </div>

            <button id="spinButton"
                    type="button"
                    class="spin-btn text-white font-bold text-sm tracking-[0.14em] uppercase
                           px-8 sm:px-10 py-3 sm:py-3.5 rounded-2xl min-w-[180px]
                           focus:outline-none focus-visible:ring-2 focus-visible:ring-brand focus-visible:ring-offset-4 focus-visible:ring-offset-bg
                           disabled:opacity-50 disabled:cursor-not-allowed">
                Spin
            </button>
        </main>

        <!-- ROW 2 col 3: Rail (Stats). self-start anchors to top-right.
              max-h + overflow on md+ so the rail can't push the grid taller than viewport. -->
        <aside class="md:col-start-3 md:row-start-2 md:self-start md:min-h-0 md:max-h-full md:overflow-y-auto min-w-0">
            <section class="panel-float bg-surface border border-border-c rounded-2xl p-4 md:p-3">
                <h2 class="text-[0.65rem] font-semibold tracking-[0.22em] uppercase text-text-muted mb-3 md:mb-2">Team Stats</h2>
                <div id="currentStreakDisplay" class="text-sm pb-3 mb-3 md:pb-2 md:mb-2 border-b border-border-c">No picks yet</div>
                <div id="pickHistory" class="text-sm"></div>
            </section>
        </aside>
    </div>

    <div id="liveWinner" class="sr-only" role="status" aria-live="polite"></div>

    <!-- Winner Modal -->
    <div id="winner"
         class="hidden fixed inset-0 z-[300] items-center justify-center p-4 bg-black/60 glass-overlay"
         role="dialog" aria-modal="true" aria-labelledby="winnerName">
        <div class="bg-surface border border-border-c rounded-3xl p-8 sm:p-10 w-full max-w-[580px] text-center animate-settle">
            <div class="text-3xl mb-3" aria-hidden="true">🦊</div>
            <div id="winnerEyebrow" class="text-text-muted text-xs font-semibold tracking-[0.28em] uppercase mb-3">Today's speaker</div>
            <div id="winnerName" class="text-brand font-black uppercase leading-[0.9] tracking-[-0.05em] text-5xl sm:text-6xl md:text-7xl mb-3"></div>
            <div id="winnerSub" class="text-text-muted text-sm sm:text-base mb-6">Are you ready to share your updates?</div>
            <button id="closeWinner"
                    type="button"
                    class="spin-btn px-8 py-3.5 min-w-[190px] rounded-2xl text-white text-sm font-bold tracking-[0.14em] uppercase focus:outline-none focus-visible:ring-2 focus-visible:ring-brand focus-visible:ring-offset-4 focus-visible:ring-offset-surface">
                Start Standup
            </button>
        </div>
    </div>

    <script>
        const names = ['Paul', 'Dimitris', 'Vlad', 'Gossip'];
        const sliceColors = ['#1C1C24', '#22222C', '#2A2A34', '#33333E'];

        function getDayIndex() {
            const urlDay = new URLSearchParams(location.search).get('day');
            if (urlDay !== null && /^[0-6]$/.test(urlDay)) return parseInt(urlDay, 10);
            return new Date().getDay();
        }

        let isSpinning = false;
        let currentRotation = 0;

        let pickStats = { currentStreak: { person: null, count: 0 }, totalPicks: {} };

        function readStorageValue(key) {
            try {
                return localStorage.getItem(key);
            } catch (e) {
                return null;
            }
        }
        function writeStorageValue(key, value) {
            try {
                localStorage.setItem(key, value);
            } catch (e) {}
        }
        function readJsonStorage(key, fallback) {
            const saved = readStorageValue(key);
            if (!saved) return fallback;
            try {
                return JSON.parse(saved);
            } catch (e) {
                return fallback;
            }
        }
        function writeJsonStorage(key, value) {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch (e) {}
        }
        function defaultStats() {
            const totalPicks = {};
            names.forEach(n => totalPicks[n] = 0);
            return { currentStreak: { person: null, count: 0 }, totalPicks };
        }
        function normalizeCount(value) {
            const count = Number(value);
            return Number.isFinite(count) && count > 0 ? Math.floor(count) : 0;
        }
        function normalizeStats(value) {
            const next = defaultStats();
            if (!value || typeof value !== 'object') return next;
            if (value.totalPicks && typeof value.totalPicks === 'object') {
                names.forEach(name => next.totalPicks[name] = normalizeCount(value.totalPicks[name]));
            }
            const streak = value.currentStreak;
            if (streak && names.includes(streak.person)) {
                next.currentStreak = {
                    person: streak.person,
                    count: Math.max(1, normalizeCount(streak.count))
                };
            }
            return next;
        }
        function loadStats() {
            pickStats = normalizeStats(readJsonStorage('foxesWheelStats', null));
        }
        function saveStats() { writeJsonStorage('foxesWheelStats', normalizeStats(pickStats)); }
        function updateStats(winner) {
            pickStats.totalPicks[winner] = (pickStats.totalPicks[winner] || 0) + 1;
            if (pickStats.currentStreak.person === winner) pickStats.currentStreak.count++;
            else pickStats.currentStreak = { person: winner, count: 1 };
            saveStats();
            displayStats();
        }
        function displayStats() {
            const streakEl = document.getElementById('currentStreakDisplay');
            const historyEl = document.getElementById('pickHistory');
            if (pickStats.currentStreak.person) {
                const c = pickStats.currentStreak.count;
                streakEl.innerHTML = c === 1
                    ? `Current: <span class="text-brand font-semibold">${pickStats.currentStreak.person}</span>`
                    : `<span class="text-brand font-semibold">${pickStats.currentStreak.person}</span> · ${c} in a row`;
            } else {
                streakEl.innerHTML = 'No picks yet';
            }
            historyEl.innerHTML = '';
            names.forEach(name => {
                const count = pickStats.totalPicks[name] || 0;
                const item = document.createElement('div');
                item.className = 'flex justify-between text-text-muted py-1 md:py-0.5 border-b border-border-c last:border-b-0';
                item.innerHTML = `<span>${name}</span><span class="text-brand font-semibold tabular-nums">${count}</span>`;
                historyEl.appendChild(item);
            });
        }

        let countdownInterval = null;
        const dayLongNames  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        const dayShortNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

        function setupDateDisplay() {
            const now = new Date();
            const isPreview = new URLSearchParams(location.search).has('day');
            const dayIdx = getDayIndex();
            const longName = dayLongNames[dayIdx];
            const auroraEl = document.querySelector('.friday-aurora');
            if (dayIdx === 5) {
                // Show first (at opacity 0), then flip the day so the CSS
                // opacity transition can fade the aurora in.
                auroraEl.style.display = 'block';
                requestAnimationFrame(() => { document.body.dataset.day = '5'; });
            } else {
                auroraEl.style.display = 'none';
                document.body.dataset.day = String(dayIdx);
            }

            const fullDate = isPreview
                ? `Preview · ${longName}`
                : `${dayShortNames[now.getDay()]} · ${now.getDate()} ${now.toLocaleDateString('en-US', { month: 'short' })} ${now.getFullYear()}`;
            document.getElementById('dateLine').textContent = fullDate;

            const dayNameEl   = document.getElementById('dayName');
            const countdownEl = document.getElementById('countdown');
            const marqueeEl   = document.getElementById('marquee');
            const weekStripEl = document.getElementById('weekStrip');
            if (dayIdx >= 1 && dayIdx <= 5) {
                weekStripEl.setAttribute('aria-valuenow', String(dayIdx));
            } else {
                weekStripEl.removeAttribute('aria-valuenow');
            }

            if (dayIdx === 5) {
                dayNameEl.innerHTML = `<span class="accent-text">Friday</span> 🎉`;
                dayNameEl.classList.add('motion-safe:animate-friday-shimmer');
                marqueeEl.classList.remove('hidden');
                marqueeEl.classList.add('block');
                tickFridayCountdown();
                if (countdownInterval) clearInterval(countdownInterval);
                countdownInterval = setInterval(tickFridayCountdown, 1000);
                countdownEl.classList.add('text-brand-soft', 'font-semibold');
                countdownEl.classList.remove('text-text-muted');
            } else {
                if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
                dayNameEl.innerHTML = `<span class="accent-text">${longName}</span>`;
                dayNameEl.classList.remove('motion-safe:animate-friday-shimmer');
                marqueeEl.classList.add('hidden');
                marqueeEl.classList.remove('block');
                countdownEl.classList.remove('text-brand-soft', 'font-semibold');
                countdownEl.classList.add('text-text-muted');

                let daysUntilFriday;
                if (dayIdx <= 5) daysUntilFriday = 5 - dayIdx;
                else daysUntilFriday = 6;
                if (dayIdx === 0)      countdownEl.textContent = 'Sunday — recharge mode';
                else if (dayIdx === 6) countdownEl.textContent = 'Saturday — enjoy it';
                else if (daysUntilFriday === 1) countdownEl.textContent = 'Tomorrow is Friday';
                else                   countdownEl.textContent = `Weekend in ${daysUntilFriday} days`;
            }

            document.querySelectorAll('.pip').forEach(p => {
                p.classList.remove('pip-done', 'pip-today', 'motion-safe:animate-pip-pulse');
                p.classList.add('pip-base');
                const pipDay = +p.dataset.day;
                if (dayIdx >= 1 && dayIdx <= 5) {
                    if (pipDay < dayIdx) {
                        p.classList.remove('pip-base');
                        p.classList.add('pip-done');
                    } else if (pipDay === dayIdx) {
                        p.classList.remove('pip-base');
                        p.classList.add('pip-today', 'motion-safe:animate-pip-pulse');
                    }
                } else {
                    p.classList.remove('pip-base');
                    p.classList.add('pip-done');
                }
            });
        }

        function tickFridayCountdown() {
            const now = new Date();
            const fivePm = new Date(now);
            fivePm.setHours(17, 0, 0, 0);
            const countdownEl = document.getElementById('countdown');
            if (now >= fivePm) {
                countdownEl.textContent = 'Weekend is here. Go.';
                if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
                return;
            }
            const diff = fivePm - now;
            const h = Math.floor(diff / 3.6e6);
            const m = Math.floor((diff % 3.6e6) / 6e4);
            const s = Math.floor((diff % 6e4) / 1000);
            countdownEl.textContent = `Weekend in ${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
        }

        function buildWheel() {
            const n = names.length;
            const seg = 2 * Math.PI / n;
            const R = 50;
            const r = 17;
            const svgNS = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(svgNS, 'svg');
            svg.id = 'wheelChart';
            svg.setAttribute('viewBox', '0 0 100 100');
            svg.setAttribute('class', 'w-full h-full');
            svg.setAttribute('aria-hidden', 'true');
            for (let i = 0; i < n; i++) {
                const a0 = -Math.PI / 2 + i * seg;
                const a1 = a0 + seg;
                const d = [
                    'M', (50 + R * Math.cos(a0)).toFixed(3), (50 + R * Math.sin(a0)).toFixed(3),
                    'A', R, R, 0, 0, 1, (50 + R * Math.cos(a1)).toFixed(3), (50 + R * Math.sin(a1)).toFixed(3),
                    'L', (50 + r * Math.cos(a1)).toFixed(3), (50 + r * Math.sin(a1)).toFixed(3),
                    'A', r, r, 0, 0, 0, (50 + r * Math.cos(a0)).toFixed(3), (50 + r * Math.sin(a0)).toFixed(3),
                    'Z'
                ].join(' ');
                const path = document.createElementNS(svgNS, 'path');
                path.setAttribute('d', d);
                path.setAttribute('fill', sliceColors[i % sliceColors.length]);
                path.setAttribute('stroke', '#0B0B0F');
                path.setAttribute('stroke-width', '0.4');
                svg.appendChild(path);
            }
            const labelR = 36;
            names.forEach((name, i) => {
                const a = -Math.PI / 2 + (i + 0.5) * seg;
                const x = 50 + labelR * Math.cos(a);
                const y = 50 + labelR * Math.sin(a);
                let deg = a * 180 / Math.PI;
                if (a > Math.PI / 2 && a < 3 * Math.PI / 2) deg += 180;
                const text = document.createElementNS(svgNS, 'text');
                text.setAttribute('transform', `translate(${x.toFixed(3)} ${y.toFixed(3)}) rotate(${deg.toFixed(3)})`);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('dominant-baseline', 'central');
                text.setAttribute('fill', '#F5F5F4');
                text.setAttribute('font-size', '4');
                text.setAttribute('font-weight', '700');
                text.textContent = name.toUpperCase();
                svg.appendChild(text);
            });
            document.getElementById('chartContainer').appendChild(svg);
        }

        function cryptoFloat() {
            const buf = new Uint32Array(1);
            crypto.getRandomValues(buf);
            return buf[0] / 0x100000000;
        }
        function weightedCryptoPick(weights) {
            const ticks = weights.map(w => Math.max(1, Math.round(w * 1_000_000)));
            const sum = ticks.reduce((a, b) => a + b, 0);
            const limit = Math.floor(0x100000000 / sum) * sum;
            const buf = new Uint32Array(1);
            let r;
            do { crypto.getRandomValues(buf); r = buf[0]; } while (r >= limit);
            let pick = r % sum;
            for (let i = 0; i < ticks.length; i++) {
                if (pick < ticks[i]) return i;
                pick -= ticks[i];
            }
            return ticks.length - 1;
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            const spinButton = document.getElementById('spinButton');
            spinButton.disabled = true;

            const n = names.length;
            const segmentAngle = 360 / n;
            const weights = new Array(n).fill(1);

            if (pickStats.currentStreak && pickStats.currentStreak.person) {
                const lastIdx = names.indexOf(pickStats.currentStreak.person);
                if (lastIdx >= 0) weights[lastIdx] = 0.2;
            }
            const isFriday = getDayIndex() === 5;
            const gossipIndex = names.indexOf('Gossip');
            if (isFriday && gossipIndex >= 0) weights[gossipIndex] *= 2.0;

            const winnerIndex = weightedCryptoPick(weights);

            const centerAngle = (winnerIndex + 0.5) * segmentAngle;
            const jitter = (cryptoFloat() * 2 - 1) * (segmentAngle / 2) * 0.55;
            const targetMod = (360 - centerAngle + jitter + 360) % 360;
            const currentMod = ((currentRotation % 360) + 360) % 360;
            const delta = (targetMod - currentMod + 360) % 360;
            const fullSpins = 8 + Math.floor(cryptoFloat() * 5);
            currentRotation += fullSpins * 360 + delta;

            document.getElementById('chartContainer').style.transform = `rotate(${currentRotation}deg)`;

            const spinDuration = reduceMotion ? 80 : 4600;
            setTimeout(() => {
                try {
                    showWinner(names[winnerIndex]);
                } finally {
                    isSpinning = false;
                    spinButton.disabled = false;
                }
            }, spinDuration);
        }

        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
        let soundOn = readStorageValue('foxesSound') === 'true';

        const dayPalettes = {
            0: ['#A78BFA', '#C4B5FD', '#7C3AED', '#FFFFFF'],
            1: ['#6366F1', '#A5B4FC', '#818CF8', '#FFFFFF'],
            2: ['#0EA5E9', '#7DD3FC', '#38BDF8', '#FFFFFF'],
            3: ['#F59E0B', '#FCD34D', '#FBBF24', '#FFFFFF'],
            4: ['#84CC16', '#BEF264', '#A3E635', '#FFFFFF'],
            5: ['#FF6A3D', '#FFB199', '#FFD166', '#C4421F', '#FFFFFF'],
            6: ['#A78BFA', '#C4B5FD', '#F0ABFC', '#FFFFFF']
        };

        function fireConfetti(mode) {
            if (reduceMotion || typeof confetti !== 'function') return;
            const dayIdx = getDayIndex();
            const colors = dayPalettes[dayIdx] || dayPalettes[5];
            const isFri = dayIdx === 5;
            const big = mode === 'welcome' || isFri;
            const count = big ? 110 : 80;
            const common = {
                particleCount: count, spread: 75, startVelocity: 55,
                ticks: 240, gravity: 0.9, colors, scalar: 1.05
            };
            confetti({ ...common, origin: { x: 0, y: 0.72 }, angle: 60 });
            confetti({ ...common, origin: { x: 1, y: 0.72 }, angle: 120 });
            if (big) {
                confetti({ ...common, particleCount: 50, spread: 110, startVelocity: 35, origin: { x: 0.5, y: 0 }, angle: 270 });
            }
        }

        function showWinner(name) {
            const eyebrow = document.getElementById('winnerEyebrow');
            const nameEl = document.getElementById('winnerName');
            const subEl = document.getElementById('winnerSub');
            if (name === 'Gossip') {
                eyebrow.textContent = 'Gossip time';
                nameEl.textContent = 'Gossip';
                subEl.textContent = "Let's discuss the gossip 🦊";
            } else {
                eyebrow.textContent = "Today's speaker";
                nameEl.textContent = name;
                subEl.textContent = 'Are you ready to share your updates?';
            }
            document.getElementById('liveWinner').textContent = `Today's speaker is ${name}`;
            const w = document.getElementById('winner');
            openDialog(w, document.getElementById('closeWinner'));

            fireConfetti('win');
            if (soundOn) playChime();
            updateStats(name);
        }
        function closeWinner() {
            const w = document.getElementById('winner');
            closeDialog(w, document.getElementById('spinButton'));
        }

        let activeDialog = null;
        let lastFocusedBeforeDialog = null;
        const focusableSelector = [
            'button:not([disabled])',
            '[href]',
            'input:not([disabled])',
            'select:not([disabled])',
            'textarea:not([disabled])',
            '[tabindex]:not([tabindex="-1"])'
        ].join(',');
        function getFocusableElements(container) {
            return Array.from(container.querySelectorAll(focusableSelector))
                .filter(el => el.offsetParent !== null);
        }
        function setPageInert(isInert) {
            const app = document.querySelector('.relative.z-10');
            if (!app) return;
            if (isInert) {
                app.setAttribute('inert', '');
                app.setAttribute('aria-hidden', 'true');
            } else {
                app.removeAttribute('inert');
                app.removeAttribute('aria-hidden');
            }
        }
        function openDialog(dialog, focusTarget) {
            lastFocusedBeforeDialog = document.activeElement;
            activeDialog = dialog;
            setPageInert(true);
            dialog.classList.remove('hidden');
            dialog.classList.add('flex');
            setTimeout(() => (focusTarget || getFocusableElements(dialog)[0] || dialog).focus(), 50);
        }
        function closeDialog(dialog, fallbackFocus) {
            dialog.classList.add('hidden');
            dialog.classList.remove('flex');
            if (activeDialog === dialog) activeDialog = null;
            setPageInert(false);
            const target = fallbackFocus || lastFocusedBeforeDialog;
            lastFocusedBeforeDialog = null;
            if (target && typeof target.focus === 'function') target.focus();
        }
        function trapDialogFocus(event) {
            if (!activeDialog || event.key !== 'Tab') return;
            const focusable = getFocusableElements(activeDialog);
            if (!focusable.length) {
                event.preventDefault();
                activeDialog.focus();
                return;
            }
            const first = focusable[0];
            const last = focusable[focusable.length - 1];
            if (event.shiftKey && document.activeElement === first) {
                event.preventDefault();
                last.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
                event.preventDefault();
                first.focus();
            }
        }

        function fridayWelcome() {
            if (getDayIndex() !== 5 || reduceMotion || typeof confetti !== 'function') return;
            setTimeout(() => fireConfetti('welcome'), 250);
        }

        let audioCtx;
        function playChime() {
            try {
                audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
                const now = audioCtx.currentTime;
                [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0, now + i * 0.07);
                    gain.gain.linearRampToValueAtTime(0.14, now + i * 0.07 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.5);
                    osc.connect(gain).connect(audioCtx.destination);
                    osc.start(now + i * 0.07);
                    osc.stop(now + i * 0.07 + 0.55);
                });
            } catch (e) {}
        }

        window.addEventListener('load', () => {
            try { localStorage.removeItem('foxesExpedites'); } catch (e) {}
            setupDateDisplay();
            loadStats();
            displayStats();
            buildWheel();
            fridayWelcome();

            const soundBtn = document.getElementById('soundToggle');
            const refreshSoundUI = () => {
                soundBtn.innerHTML = `<span aria-hidden="true">${soundOn ? '🔔' : '🔕'}</span>`;
                soundBtn.setAttribute('aria-pressed', String(soundOn));
                soundBtn.setAttribute('aria-label', soundOn ? 'Disable chime' : 'Enable chime');
            };
            refreshSoundUI();
            soundBtn.addEventListener('click', () => {
                soundOn = !soundOn;
                writeStorageValue('foxesSound', String(soundOn));
                refreshSoundUI();
                if (soundOn) playChime();
            });

            document.getElementById('spinButton').addEventListener('click', spinWheel);
            document.getElementById('closeWinner').addEventListener('click', closeWinner);

            document.addEventListener('keydown', (e) => {
                trapDialogFocus(e);
                if (e.key === 'Escape') {
                    if (!document.getElementById('winner').classList.contains('hidden')) closeWinner();
                }
                if (e.key === ' ' && document.activeElement === document.body) {
                    e.preventDefault();
                    if (!isSpinning) spinWheel();
                }
            });

            // Layout sizing: the wheel is the flexible piece. Measure the
            // actual stage slot and reserve room for the fixed Spin button.
            function fitWheelToViewport() {
                const wheel = document.getElementById('wheelOuter');
                const btn = document.getElementById('spinButton');
                const stage = document.querySelector('main');
                if (!wheel || !btn || !stage) return;
                wheel.style.removeProperty('--wheel-size');
                requestAnimationFrame(() => {
                    const stageRect = stage.getBoundingClientRect();
                    const btnRect = btn.getBoundingClientRect();
                    const stageStyle = getComputedStyle(stage);
                    const gap = parseFloat(stageStyle.rowGap || stageStyle.gap) || 0;
                    const viewportPad = matchMedia('(min-width: 768px)').matches ? 14 : 18;
                    const maxSize = matchMedia('(min-width: 1024px)').matches ? 460 : 420;
                    const availableHeight = window.innerHeight - stageRect.top - btnRect.height - gap - viewportPad;
                    const availableWidth = matchMedia('(min-width: 768px)').matches
                        ? stageRect.width
                        : stageRect.width - 22;
                    const size = Math.floor(Math.max(180, Math.min(maxSize, availableHeight, availableWidth)));
                    wheel.style.setProperty('--wheel-size', `${size}px`);

                    requestAnimationFrame(() => {
                        const overflow = btn.getBoundingClientRect().bottom - window.innerHeight + viewportPad;
                        if (overflow > 0) {
                            const adjusted = Math.max(140, size - Math.ceil(overflow));
                            wheel.style.setProperty('--wheel-size', `${adjusted}px`);
                        }
                    });
                });
            }
            function scheduleFitWheel() {
                requestAnimationFrame(fitWheelToViewport);
            }
            if ('ResizeObserver' in window) {
                const layoutObserver = new ResizeObserver(scheduleFitWheel);
                layoutObserver.observe(document.querySelector('.grid'));
                layoutObserver.observe(document.querySelector('main'));
                layoutObserver.observe(document.querySelector('aside'));
            }
            // Run multiple times to catch any layout settling (font load, chart init, rail render).
            fitWheelToViewport();
            setTimeout(fitWheelToViewport, 100);
            setTimeout(fitWheelToViewport, 400);
            window.addEventListener('resize', fitWheelToViewport);
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(fitWheelToViewport);
            }
            function scheduleCalendarRefresh() {
                const now = new Date();
                const nextMidnight = new Date(now);
                nextMidnight.setHours(24, 0, 1, 0);
                setTimeout(() => {
                    setupDateDisplay();
                    scheduleCalendarRefresh();
                }, nextMidnight - now);
            }
            scheduleCalendarRefresh();
        });
    </script>
</body>
</html>
